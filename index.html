
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consciência Negra</title>

    <style>
        body {
            background-color: #1c1c1c;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h1 {
            color: #e6a23c;
        }

        h2 {
            color: #32cd32;
        }

        p {
            font-size: 20px;
        }

        .frase {
            color: #32cd32;
            font-weight: bold;
        }

        img {
            width: 80%;
            max-width: 500px;
            border-radius: 15px;
            margin: 20px;
            border: 3px solid #e6a23c;
        }

        .galeria {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .galeria img {
            width: 280px;
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <h1>20 de Novembro</h1>
    <h2>Dia da Consciência Negra ✊🏿</h2>

    <img
        src="https://images.unsplash.com/photo-1531206715517-5c0ba140b2b8?w=800"
        alt="Pessoas reunidas celebrando a união"
    >

    <p>
        A Consciência Negra representa a luta,
        a história e a resistência do povo negro.
    </p>

    <p class="frase">
        Respeito não tem cor. Igualdade é um direito de todos!
    </p>

    <h2>História, Cultura e Resistência</h2>

    <div class="galeria">

        <img
            src="https://images.unsplash.com/photo-1504609813442-a8924e83f76e?w=600"
            alt="Celebração cultural"
        >

        <img
            src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=600"
            alt="Expressão artística e cultural"
        >

    </div>

    <p class="frase">
        Valorize a história. Respeite as diferenças.
        Combata o racismo!
    </p>

</body>
</html>
